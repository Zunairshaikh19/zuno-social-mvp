name: zunosocial
description: "ZUNO Social AI - Automated Social Media Persona SaaS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.7.0
  dartz: ^0.10.1

  # Networking & Storage
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI, Responsive & Animations
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  animate_do: ^3.3.4
  font_awesome_flutter: ^11.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  glassmorphism: ^3.0.0
  fl_chart: ^0.70.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
